name: Build Executable

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        
    - name: Setup FFmpeg
      id: setup-ffmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3
      with:
        ffmpeg-version: release    
        
    - name: Build executable
      run: |
        pyinstaller -F --additional-hooks-dir=. --windowed --add-binary "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}/ffmpeg.exe;." --add-binary "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}/ffprobe.exe;." audiosplitter.py
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioSplitter
        path: dist/audiosplitter.exe

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/audiosplitter.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true